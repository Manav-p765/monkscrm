; Production overrides (on top of php.ini-production).
expose_php = Off
memory_limit = 256M
; Import files are capped at 20 MB by the app's settings.
upload_max_filesize = 21M
post_max_size = 22M
max_execution_time = 60

; The image is immutable: never re-check files for changes.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
